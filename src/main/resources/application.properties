# Nombre de la aplicación
spring.application.name=GestorFinanciero

# Configuración de Base de Datos leyendo variables de entorno
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/gestordb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_SHOW_SQL:true}
# Hibernate detecta el dialecto automáticamente (H2 y PostgreSQL)
spring.jpa.open-in-view=false

# HikariCP: pool reducido para el tier gratis de Supabase
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
# Supabase free pausa la BD por inactividad; el despertar puede tardar ~30s+,
# por eso connection-timeout debe ser generoso para el PRIMER arranque.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:60000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT:5000}

# H2 Console (solo para desarrollo local)
spring.h2.console.enabled=${SPRING_H2_CONSOLE:true}

# Webhook - iOS Shortcuts
webhook.secret=${WEBHOOK_SECRET:dev_webhook_secret_local}
webhook.default-email=${WEBHOOK_DEFAULT_EMAIL:demo@test.com}