# Nombre de la aplicación
spring.application.name=GestorFinanciero

# Configuración de Base de Datos leyendo variables de entorno
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/gestordb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (solo para desarrollo local)
spring.h2.console.enabled=true